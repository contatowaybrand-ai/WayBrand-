<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#07100e}
.stage{position:absolute;inset:-200px;perspective:1800px}
.page{position:absolute;left:330px;top:40px;width:900px;transform:rotateX(38deg) rotateZ(-24deg) rotateY(8deg);transform-origin:50% 0;display:flex;flex-direction:column;gap:26px;padding:30px;border-radius:30px;background:#0d1a17;border:2px solid #1d3a33;box-shadow:0 0 200px rgba(0,180,144,.25)}
.b{border-radius:16px;position:relative;overflow:hidden}
.hero{height:380px;background:linear-gradient(120deg,#004d3e,#00B490 55%,#7df0cf)}
.hero:after{content:"";position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px;border-radius:50%;box-shadow:inset 0 0 0 6px rgba(255,255,255,.9);background:rgba(0,0,0,.25)}
.hero:before{content:"";position:absolute;left:calc(50% - 16px);top:calc(50% - 30px);border-left:52px solid #fff;border-top:30px solid transparent;border-bottom:30px solid transparent;z-index:1}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;height:260px}
.row i{border-radius:14px;background:linear-gradient(160deg,#14332c,#0c1f1b);border:2px solid #1f4a3f;position:relative}
.row i:nth-child(2):after{content:"";position:absolute;left:40%;top:38%;width:34px;height:34px;border-radius:50%;background:#2FE0B0;box-shadow:0 0 0 12px rgba(47,224,176,.2),0 0 40px #2FE0B0}
.dots{display:flex;gap:12px;justify-content:center}.dots i{width:14px;height:14px;border-radius:50%;background:#1f4a3f}.dots i:first-child{width:44px;border-radius:7px;background:#00B490}
.qa{height:90px;background:#10231f;border:2px solid #1f4a3f;display:flex;align-items:center;gap:20px;padding:0 26px}
.qa b{width:44px;height:44px;border-radius:10px;background:#00B490;flex:none}.qa span{height:16px;border-radius:8px;background:#24433c;flex:1}
.cmp{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;height:300px}
.cmp i{border-radius:14px;background:#0f201c;border:2px solid #1f4a3f}.cmp i:first-child{border-color:#00B490;box-shadow:0 0 40px rgba(0,180,144,.4)}
.glow{position:absolute;left:30%;top:20%;width:900px;height:900px;background:radial-gradient(circle,rgba(0,180,144,.25),transparent 60%)}
</style></head><body><div class="glow"></div><div class="stage"><div class="page">
<div class="b hero"></div><div class="row"><i></i><i></i><i></i></div><div class="dots"><i></i><i></i><i></i><i></i></div>
<div class="b qa"><b></b><span></span></div><div class="b qa"><b></b><span style="flex:.7"></span></div>
<div class="cmp"><i></i><i></i><i></i><i></i></div><div class="b hero" style="height:300px"></div>
</div></div></body></html>
