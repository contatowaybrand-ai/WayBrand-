<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Capa · camada de texto</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:300 900;src:url(assets/fonts/Inter-normal.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden}
.top{position:absolute;top:92px;left:0;right:0;text-align:center}
.apoio{font:300 44px/1.28 'Inter';color:#000;margin:0 auto 34px;max-width:920px;letter-spacing:-.01em}
.apoio b{font-weight:800}
.band{display:inline-block;background:#00B490;padding:26px 44px 32px;transform:rotate(-1.5deg);box-shadow:0 18px 50px rgba(0,0,0,.18)}
.l1{font:400 42px/1.15 'Inter';color:#fff;letter-spacing:-.01em}
.l1 b{font-weight:800}
.l2{font:900 108px/1 'Inter';color:#000;letter-spacing:-.04em;margin-top:8px}
.logo{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;height:42px}
</style></head><body>
<section class="slide" id="capa">
  <div class="top">
    <p class="apoio"><b>A+ Premium</b> não é mais só para<br>Apple, JBL e Red Bull.</p>
    <div class="band"><div class="l1">Marcas registradas na Amazon <b>podem vender</b></div><div class="l2">até 33% mais.</div></div>
  </div>
  <img class="logo" src="assets/logo-waybrand-claro.png" alt="WayBrand">
</section></body></html>
