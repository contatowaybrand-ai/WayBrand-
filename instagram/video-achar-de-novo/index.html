<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Como o cliente vai te achar de novo?</title>
<!-- Vídeo em loop de 5 s. Cada quadro é desenhado por setT(t), com t de 0 a 5. Abrir no navegador toca em tempo real. -->
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:300 900;src:url(assets/fonts/Inter-normal.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-style:italic;font-weight:300 900;src:url(assets/fonts/Inter-italic.woff2) format('woff2')}
  :root{--green:#00B490;--dark:#0C1818;--gray:#84909C;--yellow:#FCD800}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222}
  #v{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
     background:radial-gradient(ellipse 80% 60% at 50% 58%,#12302a 0%,#0C1818 55%,#060c0b 100%)}
  h1{position:absolute;top:104px;left:0;right:0;text-align:center;color:#fff;font:900 76px/1.02 'Inter';letter-spacing:-.035em;z-index:5}
  h1 em{font-style:italic;font-weight:800;color:var(--green)}
  #field{position:absolute;left:0;right:0;top:360px;height:860px;
     -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
  .cart{position:absolute;width:138px;height:120px;margin:-60px 0 0 -69px}
  .cart svg{width:100%;height:100%;overflow:visible}
  .cart path,.cart circle{fill:none;stroke:#4a585d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  #hero{position:absolute;left:540px;top:770px;width:210px;height:182px;margin:-91px 0 0 -105px;z-index:3}
  #hero svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 28px rgba(0,180,144,.75))}
  #hero path,#hero circle{fill:none;stroke:var(--green);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
  #hero .basket{fill:rgba(0,180,144,.16)}
  #hero img{position:absolute;left:72px;top:30px;width:52px}
  #glow{position:absolute;left:540px;top:790px;width:520px;height:360px;margin:-180px 0 0 -260px;border-radius:50%;
     background:radial-gradient(ellipse,rgba(0,180,144,.35),transparent 65%);z-index:2}
  #btn{position:absolute;left:540px;top:915px;transform:translateX(-50%);z-index:4;white-space:nowrap;
     background:var(--yellow);color:#0f1111;font:700 30px/1 'Inter';padding:20px 38px;border-radius:999px;box-shadow:0 14px 34px rgba(0,0,0,.45)}
  #cursor{position:absolute;width:56px;height:56px;z-index:6;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
  #logo{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);height:44px;z-index:5}
</style>
</head>
<body>
<div id="v">
  <h1>Como o cliente vai<br>te achar <em>de novo?</em></h1>
  <div id="field"></div>
  <div id="glow"></div>
  <div id="hero">
    <svg viewBox="0 0 150 130"><path class="basket" d="M30 22 L138 22 L124 78 L44 78 Z"/><path d="M6 8 L24 8 L46 92 L128 92"/><path d="M30 22 L138 22 L124 78 L44 78"/><circle cx="56" cy="112" r="10"/><circle cx="116" cy="112" r="10"/></svg>
    <img src="assets/simbolo-claro.png" alt="">
  </div>
  <div id="btn">Comprar novamente</div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22.5 L15.5 21 L12 14.2 L18.5 14.2 Z" fill="#fff" stroke="#0C1818" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <img id="logo" src="assets/logo-waybrand-claro.png" alt="WayBrand">
</div>
<script>
const CART='<svg viewBox="0 0 150 130"><path d="M6 8 L24 8 L46 92 L128 92"/><path d="M30 22 L138 22 L124 78 L44 78 Z"/><circle cx="56" cy="112" r="10"/><circle cx="116" cy="112" r="10"/></svg>';
const SP=190, ROWS=[60,235,410,585,760], CX=540, DUR=5, STOP=3.2;   // y relativo ao #field; linha do meio passa pelo herói
const field=document.getElementById('field'); const rows=[];
ROWS.forEach((y,ri)=>{ const r=[]; for(let k=-4;k<=4;k++){ const d=document.createElement('div'); d.className='cart'; d.innerHTML=CART; field.appendChild(d); r.push({el:d,k}); } rows.push({y,r,dir:ri%2?-1:1}); });
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
// trajetória do cursor (começa e termina no mesmo ponto)
const P=[[0,[930,1180]],[1.0,[300,720]],[1.9,[760,560]],[2.6,[380,960]],[3.2,[560,790]],[4.4,[560,790]],[5.0,[930,1180]]];
function cursorAt(t){ for(let i=0;i<P.length-1;i++){ const[t0,a]=P[i],[t1,b]=P[i+1]; if(t>=t0&&t<=t1){ const u=ease((t-t0)/(t1-t0)); return[lerp(a[0],b[0],u),lerp(a[1],b[1],u)]; } } return P[0][1]; }
window.setT=function(t){
  t=((t%DUR)+DUR)%DUR;
  const move=SP*ease(clamp(t/STOP));                     // desliza exatamente 1 espaço e para (loop sem emenda)
  const on=clamp((t-STOP)/.35)*(1-clamp((t-4.55)/.35));   // destaque: acende 3.2 s, apaga até 4.9 s
  rows.forEach((row,ri)=>{ row.r.forEach(c=>{
    const x=CX+c.k*SP+row.dir*move-row.dir*SP;            // em repouso, um carrinho cai exato no centro
    c.el.style.left=x+'px'; c.el.style.top=row.y+'px';
    const centre = ri===2 && Math.abs(x-CX)<2;
    c.el.style.opacity = centre ? 1-on : (1-.55*on);
  }); });
  const hero=document.getElementById('hero'); hero.style.opacity=on; hero.style.transform=`scale(${.85+.15*on})`;
  document.getElementById('glow').style.opacity=on;
  const b=clamp((t-3.55)/.3)*(1-clamp((t-4.55)/.3));
  const btn=document.getElementById('btn'); btn.style.opacity=b; btn.style.transform=`translateX(-50%) translateY(${(1-b)*18}px)`;
  const [cx,cy]=cursorAt(t); const click = t>3.2&&t<3.45 ? .85 : 1;
  const cur=document.getElementById('cursor'); cur.style.left=(cx-8)+'px'; cur.style.top=(cy-4)+'px'; cur.style.transform=`scale(${click})`;
};
if(!window.__render){ const s=performance.now(); (function tick(){ setT((performance.now()-s)/1000); requestAnimationFrame(tick); })(); } else setT(0);
</script>
</body>
</html>
