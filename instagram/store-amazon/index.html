<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Store Amazon · post</title>
<style>
  /* RF Dewi Extended (paga): os .ttf ficam só local, fora do git */
  @font-face{font-family:'Dewi';font-weight:300;src:url(assets/fonts/RFDewiExtended-Light.ttf) format('truetype')}
  @font-face{font-family:'Dewi';font-weight:400;src:url(assets/fonts/RFDewiExtended-Regular.ttf) format('truetype')}
  @font-face{font-family:'Dewi';font-weight:600;src:url(assets/fonts/RFDewiExtended-Semibold.ttf) format('truetype')}
  :root{--green:#00B490}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222;font-family:'Dewi',sans-serif;-webkit-font-smoothing:antialiased;padding:40px}
  /* céu no mesmo tom da foto da sacola, com nuvens desfocadas e grão de filme */
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;
    background:linear-gradient(180deg,#00669f 0%,#037cb4 25%,#3a95cc 55%,#6fb1dd 80%,#a9cbe6 100%)}
  .cloud{position:absolute;border-radius:50%;background:#fff;filter:blur(38px);opacity:.75}
  .grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:overlay;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

  /* notebook */
  .stage{position:absolute;left:0;right:0;top:420px;height:760px;perspective:2200px}
  .laptop{position:absolute;left:50%;top:0;width:900px;margin-left:-470px;transform-style:preserve-3d;
    transform:rotateX(8deg) rotateY(-12deg) rotateZ(-3deg) scale(.92)}
  .lid{position:relative;width:900px;height:572px;border-radius:30px;padding:3px;
    background:linear-gradient(135deg,#e9ebee,#aeb2b8 45%,#d9dce0);box-shadow:0 50px 90px rgba(0,30,70,.35)}
  .bezel{position:relative;width:100%;height:100%;border-radius:27px;background:#0b0b0c;padding:22px 22px 26px}
  .bezel:before{content:"";position:absolute;left:50%;top:0;width:150px;height:18px;margin-left:-75px;background:#0b0b0c;border-radius:0 0 10px 10px;z-index:2}
  .screen{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#fff}
  .url{height:34px;display:flex;align-items:center;justify-content:center;background:#f1f1f1;border-bottom:1px solid #ddd;
    font:400 12px/1 'Dewi';color:#777;letter-spacing:.02em}
  .url:before{content:"";position:absolute;left:14px;top:12px;width:10px;height:10px;border-radius:50%;background:#e2584f;box-shadow:16px 0 #e8b33f,32px 0 #4fbe5b}
  .page{position:absolute;left:0;right:0;top:34px;bottom:0;background:url(assets/loja-repeat.png) left top/auto 100% no-repeat #f6d3c4}
  .shine{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.16),transparent 40%);pointer-events:none}
  .base{position:relative;width:1010px;height:30px;margin-left:-55px;margin-top:-4px;border-radius:2px 2px 26px 26px;
    background:linear-gradient(180deg,#f2f3f5 0%,#c3c7cc 55%,#8c9198 100%);box-shadow:0 30px 50px rgba(0,30,70,.3)}
  .base:before{content:"";position:absolute;left:50%;top:0;width:160px;height:10px;margin-left:-80px;border-radius:0 0 12px 12px;background:#b4b8bd}

  .logo{position:absolute;left:64px;top:64px;height:44px}
  .copy{position:absolute;left:66px;top:150px;color:#fff;font:300 25px/1.32 'Dewi';letter-spacing:-.01em}
  .copy b{font-weight:600}
  .tag{position:absolute;right:66px;bottom:70px;color:#fff;font:400 13px/1 'Dewi';letter-spacing:.3em;text-transform:uppercase;opacity:.9}
</style>
</head>
<body>
<section class="slide" id="post">
  <div class="cloud" style="left:-120px;top:560px;width:520px;height:200px"></div>
  <div class="cloud" style="left:720px;top:980px;width:520px;height:190px;opacity:.6"></div>
  <div class="cloud" style="left:120px;top:1180px;width:640px;height:220px;opacity:.85"></div>
  <div class="cloud" style="left:780px;top:260px;width:360px;height:120px;opacity:.35"></div>

  <div class="stage"><div class="laptop">
    <div class="lid"><div class="bezel"><div class="screen">
      <div class="url">amazon.com.br/stores/Repeat</div>
      <div class="page"></div><div class="shine"></div>
    </div></div></div>
    <div class="base"></div>
  </div></div>

  <img class="logo" src="assets/logo-waybrand-claro.png" alt="WayBrand">
  <p class="copy">A gente cria a <b>Store</b><br>da sua marca: design<br>profissional e estratégia.</p>
  <div class="tag">Store · Repeat</div>
  <div class="grain"></div>
</section>
</body>
</html>
