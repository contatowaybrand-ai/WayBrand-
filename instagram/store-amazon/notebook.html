<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Store Amazon · notebook</title>
<style>
  /* RF Dewi Extended (paga): os .ttf ficam só local, fora do git */
  @font-face{font-family:'Dewi';font-weight:300;src:url(assets/fonts/RFDewiExtended-Light.ttf) format('truetype')}
  @font-face{font-family:'Dewi';font-weight:600;src:url(assets/fonts/RFDewiExtended-Semibold.ttf) format('truetype')}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222;font-family:'Dewi',sans-serif;-webkit-font-smoothing:antialiased;padding:40px}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:url(assets/notebook.jpg) center/cover}
  /* print da loja encaixado na tela do notebook (cantos em CANTOS, abaixo) */
  .screen{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff url(assets/loja-repeat.png) top center/cover}
  .screen:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.10),transparent 45%,rgba(0,0,0,.06))}
  .logo{position:absolute;left:64px;top:64px;height:44px}
  .copy{position:absolute;left:66px;top:150px;color:#fff;font:300 25px/1.32 'Dewi';letter-spacing:-.01em}
  .copy b{font-weight:600}
</style>
</head>
<body>
<section class="slide" id="post">
  <div class="screen"></div>
  <img class="logo" src="assets/logo-waybrand-claro.png" alt="WayBrand">
  <p class="copy">A gente cria a <b>Store</b><br>da sua marca: design<br>profissional e estratégia.</p>
</section>
<script>
  // cantos da tela na foto (px do post 1080x1350): sup-esq, sup-dir, inf-dir, inf-esq
  const CANTOS = [[300, 430], [790, 400], [810, 760], [290, 800]];
  const W = 1440, H = 900; // tamanho do print (16:10)

  // homografia retângulo W×H -> quadrilátero, em matrix3d
  function matriz(q) {
    const s = [[0, 0], [W, 0], [W, H], [0, H]], A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const [x, y] = s[i], [u, v] = q[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
    }
    for (let c = 0; c < 8; c++) { // eliminação de Gauss
      let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
      for (let r = 0; r < 8; r++) if (r !== c) { const f = A[r][c] / A[c][c]; for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k]; b[r] -= f * b[c]; }
    }
    const h = b.map((v, i) => v / A[i][i]);
    return `matrix3d(${h[0]},${h[3]},0,${h[6]},${h[1]},${h[4]},0,${h[7]},0,0,1,0,${h[2]},${h[5]},0,1)`;
  }
  const el = document.querySelector('.screen');
  el.style.width = W + 'px'; el.style.height = H + 'px'; el.style.transform = matriz(CANTOS);
</script>
</body>
</html>
