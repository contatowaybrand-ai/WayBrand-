<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sinal verde · carrossel</title>
<style>
  /* Fonte: RF Dewi Extended Light (paga: o arquivo fica só local, fora do git; ver LEGENDA-E-NOTAS.md).
     Só existe o peso Light, então o "negrito" é o mesmo desenho engrossado com contorno (.b).
     Sem o arquivo, cai na Onest. */
  @font-face{font-family:'Dewi';font-weight:100 900;src:local('RF Dewi Extended Light'),url(assets/fonts/RFDewiExtended-Light.ttf) format('truetype'),url(assets/fonts/Onest-300.woff2) format('woff2')}
  :root{--green:#00B490;--ink:#0b1714;--white:#fff;--sky:linear-gradient(180deg,#9fe9fe 0%,#a6edfe 14%,#cdf8fe 50%,#e6fdff 80%,#f3ffff 100%)}
  *{margin:0;padding:0;box-sizing:border-box}
  b,.bold{font-weight:300;-webkit-text-stroke:.045em currentColor;paint-order:stroke fill}
  body{background:#222;font-family:'Dewi',sans-serif;-webkit-font-smoothing:antialiased;padding:40px;display:flex;flex-direction:column;gap:40px}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--sky);color:var(--ink)}

  /* ---------- capa ---------- */
  /* céu contínuo: o fundo repete o degradê do céu da foto, que entra com borda esfumada */
  .photo{position:absolute;right:0;bottom:0;width:883px;height:1218px;
    background:url(assets/semaforo-ref.jpg) center/cover no-repeat;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 260px),linear-gradient(180deg,transparent 0,#000 120px);
    -webkit-mask-composite:source-in;mask-composite:intersect}
  /* quadro do pisca: mesma foto com o bonequinho apagado por cima */
  .photo.off{background-image:url(assets/semaforo-apagado.jpg);opacity:0}
  body.apagado .photo.off{opacity:1}

  .title{position:absolute;left:66px;top:62px;font:300 92px/1.04 'Dewi';letter-spacing:-.02em;text-transform:uppercase}
  .logo{position:absolute;right:66px;top:76px;height:36px}

  /* rótulos: uma coluna só, numerada, presa num fio vertical (o "caminho" do pedestre) */
  .route{position:absolute;left:66px;top:400px;height:560px;display:flex;flex-direction:column;justify-content:space-between;
    padding-left:26px;border-left:1.5px solid rgba(11,23,20,.35)}
  .route div{position:relative;display:flex;align-items:baseline;gap:16px;font:300 22px/1 'Dewi';letter-spacing:.14em;text-transform:uppercase}
  .route div:before{content:"";position:absolute;left:-31px;top:50%;width:8px;height:8px;margin-top:-5px;background:var(--ink)}
  .route div:last-child:before{background:var(--green)}
  .route small{font:300 15px/1 'Dewi';letter-spacing:.1em;opacity:.55;width:24px;font-variant-numeric:tabular-nums}

  .end{position:absolute;left:66px;bottom:66px;text-transform:uppercase}
  .end .s{font:300 72px/1 'Dewi';letter-spacing:-.02em}
  .end .l{-webkit-text-stroke:.03em currentColor;font:300 118px/1 'Dewi';letter-spacing:-.03em;margin-top:6px}
  .end .l i{font-style:normal;color:var(--green)}

  /* ---------- slides internos: mesma foto, inteira e com opacidade ---------- */
  .bg{position:absolute;inset:0;background:url(assets/semaforo-ref.jpg) 70% 60%/cover no-repeat;opacity:.22}
  .num{position:absolute;right:66px;top:70px;font:300 26px/1 'Dewi';letter-spacing:.1em}
  .logo-s{position:absolute;left:66px;bottom:70px;height:30px}
  .check{position:absolute;left:66px;top:70px;display:flex;align-items:center;gap:12px;font:300 22px/1 'Dewi';letter-spacing:.14em;text-transform:uppercase}
  .check:before{content:"";width:8px;height:8px;background:var(--green)}
  .check.q:before{background:var(--ink)}
  .big{position:absolute;left:66px;right:66px;font:300 112px/1.02 'Dewi';letter-spacing:-.03em;text-transform:uppercase}
  .big.m{font-size:78px;line-height:1.04}
  .big i{font-style:normal;color:var(--green)}
  .next{position:absolute;right:66px;bottom:70px;font:300 20px/1 'Dewi';letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>

<!-- 01 · capa -->
<section class="slide" id="s1">
  <div class="photo"></div>
  <div class="photo off"></div>
  <h1 class="title">Sinal verde<br>pra sua <b>marca</b></h1>
  <img class="logo" src="assets/logo-waybrand-escuro.png" alt="WayBrand">
  <div class="route">
    <div><small>01</small>Branding</div>
    <div><small>02</small>Posicionamento</div>
    <div><small>03</small>Anúncios</div>
    <div><small>04</small>Resultado</div>
  </div>
  <div class="end"><div class="s">Agora é</div><div class="l">sua vez<i>.</i></div></div>
</section>

<!-- 02 -->
<section class="slide" id="s2">
  <div class="bg"></div>
  <div class="check">Marca registrada</div>
  <div class="num">02</div>
  <p class="big" style="top:520px">Se você já tem<br>a marca<br><b>registrada</b><i>,</i></p>
  <img class="logo-s" src="assets/logo-waybrand-escuro.png" alt="WayBrand">
  <div class="next">Arrasta →</div>
</section>

<!-- 03 -->
<section class="slide" id="s3">
  <div class="bg"></div>
  <div class="check">Produto validado</div>
  <div class="num">03</div>
  <p class="big" style="top:600px">produto<br><b>validado</b><i>,</i></p>
  <img class="logo-s" src="assets/logo-waybrand-escuro.png" alt="WayBrand">
  <div class="next">Arrasta →</div>
</section>

<!-- 04 -->
<section class="slide" id="s4">
  <div class="bg"></div>
  <div class="check q">Posicionamento?</div>
  <div class="num">04</div>
  <p class="big m" style="top:400px">por que sua marca<br>ainda não está<br><b>bem posicionada</b><br>dentro da Amazon<i>?</i></p>
  <img class="logo-s" src="assets/logo-waybrand-escuro.png" alt="WayBrand">
</section>

</body>
</html>
