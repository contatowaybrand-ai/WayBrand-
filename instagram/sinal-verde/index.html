<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sinal verde · post</title>
<style>
  @font-face{font-family:'Poppins';font-weight:200;src:url(assets/fonts/Poppins-200.woff2) format('woff2')}
  @font-face{font-family:'Poppins';font-weight:300;src:url(assets/fonts/Poppins-300.woff2) format('woff2')}
  @font-face{font-family:'Poppins';font-weight:400;src:url(assets/fonts/Poppins-400.woff2) format('woff2')}
  @font-face{font-family:'Poppins';font-weight:500;src:url(assets/fonts/Poppins-500.woff2) format('woff2')}
  @font-face{font-family:'Poppins';font-weight:600;src:url(assets/fonts/Poppins-600.woff2) format('woff2')}
  :root{--green:#00B490;--ink:#0b1714;--white:#fff}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222;font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased;padding:40px}
  /* céu contínuo: o fundo repete o degradê do céu da foto, que entra com borda esfumada */
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;
    background:linear-gradient(180deg,#9fe9fe 0%,#a6edfe 14%,#cdf8fe 50%,#e6fdff 80%,#f3ffff 100%)}
  .photo{position:absolute;right:0;bottom:0;width:883px;height:1218px;
    background:url(assets/semaforo-ref.jpg) center/cover no-repeat;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 260px),linear-gradient(180deg,transparent 0,#000 120px);
    -webkit-mask-composite:source-in;mask-composite:intersect}
  /* quadro do pisca: mesma foto com o bonequinho apagado por cima */
  .photo.off{background-image:url(assets/semaforo-apagado.jpg);opacity:0}
  body.apagado .photo.off{opacity:1}

  /* topo: título em duas linhas, fino com uma palavra em negrito */
  .title{position:absolute;left:66px;top:62px;font:300 104px/1.0 'Poppins';letter-spacing:-.01em;color:var(--ink);text-transform:uppercase}
  .title b{font-weight:600}

  .logo{position:absolute;right:66px;top:76px;height:36px}

  /* rótulos soltos com marcador quadrado */
  .tag{position:absolute;font:300 22px/1 'Poppins';letter-spacing:.04em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:10px}
  .tag:before{content:"";width:7px;height:7px;background:currentColor}
  .tag.w{color:var(--white)}

  /* rodapé: linha curta + frase grande */
  .end{position:absolute;left:66px;bottom:66px;color:var(--ink);text-transform:uppercase}
  .end .s{font:300 72px/1 'Poppins';letter-spacing:-.01em}
  .end .l{font:500 118px/1 'Poppins';letter-spacing:-.02em;margin-top:6px}
  .end .l i{font-style:normal;color:var(--green)}
</style>
</head>
<body>
<section class="slide" id="post">
  <div class="photo"></div>
  <div class="photo off"></div>

  <h1 class="title">Sinal verde<br>pra sua <b>marca</b></h1>
  <img class="logo" src="assets/logo-waybrand-escuro.png" alt="WayBrand">

  <div class="tag" style="left:70px;top:420px">Branding</div>
  <div class="tag w" style="left:640px;top:520px">Posicionamento</div>
  <div class="tag" style="left:150px;top:740px">Anúncios</div>
  <div class="tag w" style="left:860px;top:1010px">Resultado</div>

  <div class="end"><div class="s">Agora é</div><div class="l">sua vez<i>.</i></div></div>
</section>
</body>
</html>
