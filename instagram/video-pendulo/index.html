<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Precisa de… Deixa com a gente.</title>
<!-- Reel 1080x1920, 28,8 s em loop. Cada quadro é desenhado por setT(t). Abrir no navegador toca em tempo real.
     Roteiro (cópia da referência): um pêndulo com a tag da WayBrand balança e o fio funciona como cortina.
     À esquerda do fio aparece a pergunta "PRECISA DE … ?" (verde-escuro), à direita a resposta "DEIXA COM A GENTE." (branco).
     A pergunta troca a cada ida e volta (2,4 s), sempre com o fio no extremo esquerdo, quando ela está escondida.
     Pra trocar as frases é só editar PERGUNTAS e RESPOSTA abaixo e rodar `node render.mjs`. -->
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:300 900;src:url(assets/fonts/Inter-normal.woff2) format('woff2')}
  :root{--brand:#18614D;--ink:#0A2E24;--mint:#9BEFCB}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222}
  #v{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
     background:radial-gradient(ellipse 78% 46% at 50% 47%,#3A9E7E 0%,#2A8467 24%,#1D6C55 48%,#18614D 66%,#114838 100%)}
  #v:after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;
     background:radial-gradient(ellipse 95% 70% at 50% 48%,transparent 55%,rgba(4,24,18,.38) 100%)}
  #logo{position:absolute;top:150px;left:50%;width:330px;transform:translateX(-50%);z-index:2}
  .txt{position:absolute;left:0;right:0;top:0;height:100%;z-index:3}
  .txt p{position:absolute;left:0;right:0;top:850px;transform:translateY(-50%);text-align:center;text-transform:uppercase;
     font-weight:900;line-height:.98;letter-spacing:-.01em;white-space:nowrap}
  #q p{color:var(--ink)}
  #a p{color:#fff}
  #foot{position:absolute;left:0;right:0;top:1608px;text-align:center;z-index:2}
  #foot b{display:block;color:#fff;font:700 31px/1 'Inter';letter-spacing:.14em}
  #foot span{display:block;margin-top:22px;color:var(--mint);font:700 31px/1 'Inter';letter-spacing:.06em}
  /* pêndulo: o container gira em torno do pivô, acima do quadro */
  .pend{position:absolute;left:540px;top:-1600px;width:0;height:0;z-index:5}
  .pend .fio{position:absolute;left:-3.5px;top:0;width:7px;height:2512px;background:#06231B;border-radius:4px}
  .pend .tag{position:absolute;left:-96px;top:2500px;width:192px;height:192px;border-radius:46px;
     background:linear-gradient(150deg,#16483A 0%,#0B2D24 55%,#082119 100%);
     box-shadow:inset 0 3px 0 rgba(255,255,255,.08),inset 0 -6px 12px rgba(0,0,0,.35),0 26px 46px rgba(3,20,15,.5)}
  .pend .tag:before{content:"";position:absolute;left:50%;top:-14px;width:22px;height:22px;margin-left:-11px;border-radius:50%;
     border:6px solid #06231B;background:transparent}
  .pend .tag svg{position:absolute;left:41px;top:41px;width:110px;height:110px}
  #sombra{z-index:4;filter:blur(10px);opacity:.28}
  #sombra .fio,#sombra .tag{background:#021510;box-shadow:none}
  #sombra .tag:before,#sombra svg{display:none}
</style>
</head>
<body>
<div id="v">
  <img id="logo" src="assets/logo-waybrand-menta.png" alt="WayBrand">
  <div id="q" class="txt"><p></p></div>
  <div id="a" class="txt"><p></p></div>
  <div id="sombra" class="pend"><div class="fio"></div><div class="tag"></div></div>
  <div id="pend" class="pend"><div class="fio"></div><div class="tag">
    <svg viewBox="-40 -40 80 80"><g id="raios" fill="#9BEFCB"></g></svg>
  </div></div>
  <div id="foot"><b>DESIGN · AMAZON · CRESCIMENTO</b><span>@waybrand.co</span></div>
</div>
<script>
// ── Frases (edite aqui) ───────────────────────────────────────────────
const PERGUNTAS = [
  ['PRECISA DE', 'A+ PREMIUM?'],
  ['PRECISA DE', 'UMA MARCA?'],
  ['PRECISA DE', 'IMAGENS?'],
  ['PRECISA DE', 'AMAZON ADS?'],
  ['PRECISA DE', 'UMA VITRINE?'],
  ['PRECISA', 'VENDER MAIS?'],
  ['PRECISA DE', 'UM VÍDEO?'],
  ['PRECISA DE', 'ESTRATÉGIA?'],
  ['PRECISA DE', 'MAIS CLIQUES?'],
  ['PRECISA', 'APARECER?'],
  ['PRECISA DE', 'CONTEÚDO?'],
  ['PRECISA', 'CRESCER?'],
];
const RESPOSTA = ['DEIXA COM', 'A GENTE.'];
// ── Movimento ─────────────────────────────────────────────────────────
const T = 2.4, DUR = T * PERGUNTAS.length;     // uma ida e volta por pergunta → 28,8 s
const AMP = 9.75 * Math.PI / 180;                // amplitude do pêndulo
const PX = 540, PY = -1600;                     // pivô (fora do quadro, acima)
const MAXW = 650, FS = 112;                     // largura máxima do texto e corpo base

// símbolo ❋ da WayBrand: 8 raios em cunha
document.getElementById('raios').innerHTML = [...Array(8)].map((_, i) =>
  `<polygon points="0,1 -7.5,-36 7.5,-36" transform="rotate(${i * 45}) scale(${i % 2 ? .9 : 1})"/>`).join('');

const q = document.querySelector('#q p'), a = document.querySelector('#a p');
const pend = document.getElementById('pend'), sombra = document.getElementById('sombra');
function fit(el, linhas) {
  el.style.fontSize = FS + 'px';
  el.innerHTML = linhas.map(l => `<span style="display:inline-block">${l}</span>`).join('<br>');
  const w = Math.max(...[...el.children].filter(c => c.tagName === 'SPAN').map(c => c.offsetWidth));
  if (w > MAXW) el.style.fontSize = (FS * MAXW / w) + 'px';
}
let atual = -1;
function setT(t) {
  t = ((t % DUR) + DUR) % DUR;
  const k = Math.floor(t / T);
  if (k !== atual) { atual = k; fit(q, PERGUNTAS[k]); }
  const th = -AMP * Math.cos(2 * Math.PI * t / T);   // t=0 → extremo esquerdo
  pend.style.transform = `rotate(${-th}rad)`;
  sombra.style.transform = `translate(26px,14px) rotate(${-th}rad)`;
  // fio como cortina: x do fio em y
  const tn = Math.tan(th), x0 = PX + tn * (0 - PY), x1 = PX + tn * (1920 - PY);
  document.getElementById('q').style.clipPath = `polygon(0 0,${x0}px 0,${x1}px 1920px,0 1920px)`;
  document.getElementById('a').style.clipPath = `polygon(${x0}px 0,1080px 0,1080px 1920px,${x1}px 1920px)`;
}
fit(a, RESPOSTA);
window.setT = setT;
document.fonts.ready.then(() => { fit(a, RESPOSTA); atual = -1; setT(0);
  if (!window.__render) { const t0 = performance.now(); (function loop(){ setT((performance.now() - t0) / 1000); requestAnimationFrame(loop); })(); } });
</script>
</body>
</html>
